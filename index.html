<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PİKOS SORU BANKASI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --success: #10b981;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 2rem 1rem;
        }

        /* Glassmorphism Background Elements */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.4;
        }
        .blob-1 {
            top: -10%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: var(--primary);
        }
        .blob-2 {
            bottom: -10%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: var(--accent);
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            z-index: 10;
            animation: fadeIn 1s ease-out;
            flex-wrap: wrap;
            justify-content: center;
        }

        select {
            appearance: none;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.75rem 3rem 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            outline: none;
            font-family: 'Inter', sans-serif;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem top 50%;
            background-size: 0.65rem auto;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        select:hover {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }
        
        select option {
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* Flashcard Container */
        .flashcard-container {
            width: 100%;
            max-width: 600px;
            height: 350px;
            perspective: 1000px;
            margin-bottom: 2rem;
            z-index: 10;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2.5rem;
            text-align: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow);
        }

        .card-front {
            /* Front specific styles */
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border-top: 2px solid var(--primary);
        }

        .card-label {
            position: absolute;
            top: 1.5rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .card-content {
            font-size: 1.4rem;
            line-height: 1.5;
            font-weight: 500;
        }
        
        .card-back .card-content {
            color: #e2e8f0;
            font-size: 1.25rem;
        }

        .card-back .card-content hr {
            border: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 1.2rem 0;
        }

        .card-back .card-content small {
            display: block;
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.5;
            text-align: left;
        }

        .card-back .card-content small strong {
            color: #cbd5e1;
        }

        .card-hint {
            position: absolute;
            bottom: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: pulse 2s infinite;
        }

        .card-hint svg {
            width: 16px;
            height: 16px;
        }

        .navigation {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            z-index: 10;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-hover), var(--accent-hover));
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }

        .progress-container {
            width: 100%;
            max-width: 600px;
            margin-top: 2rem;
            z-index: 10;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: background 0.2s;
        }
        .progress-bar-bg:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 10px;
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        @media (max-width: 640px) {
            h1 { font-size: 2rem; }
            .flashcard-container { height: 400px; }
            .card-content { font-size: 1.2rem; }
            .controls { flex-direction: column; width: 100%; max-width: 300px; }
            select { width: 100%; }
        }
    
        /* Home Grid */
        .home-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1000px;
            margin-top: 1rem;
            animation: fadeIn 0.8s ease-out;
        }

        .category-btn {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            color: white;
            font-size: 1.25rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .category-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: inherit;
            filter: brightness(1.3);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: -1;
        }

        .category-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .category-btn:hover::before {
            opacity: 0.2;
        }

        .cat-subtitle {
            font-size: 0.9rem;
            font-weight: 400;
            opacity: 0.8;
            font-family: 'Inter', sans-serif;
        }

        .back-btn {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            z-index: 100;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-3px);
        }

        #flashcardMode {
            width: 100%;
            display: none; /* hidden by default */
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s ease-out;
        }

        @media (max-width: 768px) {
            .back-btn {
                position: relative;
                top: 0;
                left: 0;
                margin-bottom: 1.5rem;
                align-self: flex-start;
            }
        }

    
        /* Star Button */
        .star-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            color: #fbbf24;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 20;
        }
        
        .star-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.2);
        }

        .star-btn.active svg {
            fill: #fbbf24;
        }

    
        /* Search Bar */
        .search-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-input {
            width: 100%;
            padding: 1.2rem 1.5rem;
            padding-right: 4rem;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            color: var(--text-main);
            font-size: 1.1rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            background: rgba(30, 41, 59, 1);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-btn {
            position: absolute;
            right: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .search-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-50%) scale(1.1);
        }

    
        /* Pomodoro Widget */
        .pomodoro-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 1000;
            min-width: 140px;
            border-top: 3px solid var(--primary);
            transition: all 0.3s ease;
        }

        .pomodoro-container.break-mode {
            border-top: 3px solid var(--success);
        }

        .pomo-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .pomo-time {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1;
        }

        .pomo-controls {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.25rem;
        }

        .pomo-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pomo-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
        }
        
        @media (max-width: 600px) {
            .pomodoro-container {
                bottom: 1rem;
                right: 1rem;
                padding: 0.75rem 1rem;
                min-width: 120px;
            }
            .pomo-time { font-size: 1.8rem; }
            .pomo-btn { width: 32px; height: 32px; }
        }

    </style>
</head>
<body>

    <!-- Ambient Background -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <header>
        <h1>PİKOS SORU BANKASI</h1>
        <p class="subtitle">KPSS Hazırlık Bilgi Kartları</p>
    </header>

    
    <button id="backBtn" class="back-btn" style="display: none;" onclick="showHome()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Anasayfaya Dön
    </button>

    <div id="homeMode" class="home-grid">

        <!-- Search Bar -->
        <div style="grid-column: 1 / -1; margin-bottom: 1.5rem;">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Soru veya kavram ara... (Örn: Lozan, Sancağa Çıkma)" onkeypress="handleSearch(event)">
                <button class="search-btn" onclick="executeSearch()" title="Ara">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>
        </div>

        <button class="category-btn" style="border-left: 6px solid #3b82f6;" onclick="startCategory('islamiyet_oncesi')">
            İslamiyet Öncesi
            <span class="cat-subtitle" id="count_islamiyet_oncesi">Tarih Bilgi Kartları</span>
        </button>
        <button class="category-btn" style="border-left: 6px solid #10b981;" onclick="startCategory('ilk_turk_islam')">
            İlk Türk İslam
            <span class="cat-subtitle" id="count_ilk_turk_islam">Tarih Bilgi Kartları</span>
        </button>
        <button class="category-btn" style="border-left: 6px solid #8b5cf6;" onclick="startCategory('osmanli')">
            Osmanlı Devleti
            <span class="cat-subtitle" id="count_osmanli">Tarih Bilgi Kartları</span>
        </button>
        <button class="category-btn" style="border-left: 6px solid #ef4444;" onclick="startCategory('inkilap')">
            İnkılap Tarihi
            <span class="cat-subtitle" id="count_inkilap">Tarih Bilgi Kartları</span>
        </button>
        <button class="category-btn" style="border-left: 6px solid #f59e0b;" onclick="startCategory('cagdas')">
            Çağdaş Türk ve Dünya
            <span class="cat-subtitle" id="count_cagdas">Tarih Bilgi Kartları</span>
        </button>
        <button class="category-btn" style="border-left: 6px solid #ec4899;" onclick="startCategory('karisik')">
            Karışık Çözüm
            <span class="cat-subtitle" id="count_karisik">Tüm Kategoriler</span>
        </button>
        

        <button class="category-btn" style="background: linear-gradient(145deg, #b91c1c, #7f1d1d); border-left: 6px solid #ef4444; grid-column: 1 / -1; margin-bottom: 0rem;" onclick="startCategory('yeni_nesil_zor')">
            PİKOS Özel (ZOR) - Çıkıyor Seçmece
            <span class="cat-subtitle" id="count_yeni_nesil_zor" style="color: #fca5a5;">Sınav Kazandıran Detaylar</span>
        </button>
        <div style="grid-column: 1 / -1; margin-top: 1rem; margin-bottom: 0.5rem;">
            <h3 style="color: var(--text-muted); font-weight: 500; font-size: 1.1rem; border-bottom: 1px solid var(--card-border); padding-bottom: 0.5rem;">Özel Alan</h3>
        </div>
        <button class="category-btn" style="background: linear-gradient(145deg, rgba(251, 191, 36, 0.15), rgba(30, 41, 59, 0.7)); border-left: 6px solid #fbbf24;" onclick="startCategory('favoriler')">
            Favorilerim / Yıldızladıklarım
            <span class="cat-subtitle" id="count_favoriler">Yükleniyor...</span>
        </button>
        
        <div style="grid-column: 1 / -1; margin-top: 1rem;">
            <h3 style="color: var(--text-muted); font-weight: 500; font-size: 1.1rem; border-bottom: 1px solid var(--card-border); padding-bottom: 0.5rem; margin-bottom: 0.5rem;">Çıkmış Sorular (ÖSYM Arşivi)</h3>
        </div>
        
        <button class="category-btn" style="background: linear-gradient(145deg, rgba(59, 130, 246, 0.2), rgba(30, 41, 59, 0.7)); border-left: 6px solid #3b82f6;" onclick="startCategory('cikmis_islamiyet')">
            Çıkmış: İslamiyet Öncesi
            <span class="cat-subtitle" id="count_cikmis_islamiyet">Geçmiş Yıllar Soru Havuzu</span>
        </button>
        <button class="category-btn" style="background: linear-gradient(145deg, rgba(16, 185, 129, 0.2), rgba(30, 41, 59, 0.7)); border-left: 6px solid #10b981;" onclick="startCategory('cikmis_turk_islam')">
            Çıkmış: İlk Türk İslam
            <span class="cat-subtitle" id="count_cikmis_turk_islam">Geçmiş Yıllar Soru Havuzu</span>
        </button>
        <button class="category-btn" style="background: linear-gradient(145deg, rgba(139, 92, 246, 0.2), rgba(30, 41, 59, 0.7)); border-left: 6px solid #8b5cf6;" onclick="startCategory('cikmis_osmanli')">
            Çıkmış: Osmanlı
            <span class="cat-subtitle" id="count_cikmis_osmanli">Geçmiş Yıllar Soru Havuzu</span>
        </button>
        <button class="category-btn" style="background: linear-gradient(145deg, rgba(239, 68, 68, 0.2), rgba(30, 41, 59, 0.7)); border-left: 6px solid #ef4444;" onclick="startCategory('cikmis_inkilap')">
            Çıkmış: İnkılap
            <span class="cat-subtitle" id="count_cikmis_inkilap">Geçmiş Yıllar Soru Havuzu</span>
        </button>
        <button class="category-btn" style="background: linear-gradient(145deg, rgba(245, 158, 11, 0.2), rgba(30, 41, 59, 0.7)); border-left: 6px solid #f59e0b;" onclick="startCategory('cikmis_cagdas')">
            Çıkmış: Çağdaş
            <span class="cat-subtitle" id="count_cikmis_cagdas">Geçmiş Yıllar Soru Havuzu</span>
        </button>
    </div>

    <div id="flashcardMode">
        <div class="controls">
        <select id="unitSelect" onchange="changeUnit()">
            <optgroup label="Konu Anlatımı (Pusula Notları)">
                <option value="islamiyet_oncesi">İslamiyet Öncesi Türk Tarihi</option>
                <option value="ilk_turk_islam">İlk Türk İslam Devletleri</option>
                <option value="osmanli">Osmanlı Devleti</option>
                <option value="inkilap">İnkılap Tarihi</option>
                <option value="cagdas">Çağdaş Türk ve Dünya Tarihi</option>

        const unitNames = {

            "ilk_turk_islam": "İlk Türk İslam Devletleri",
            "osmanli": "Osmanlı Devleti",
            "inkilap": "İnkılap Tarihi",
            "cagdas": "Çağdaş Türk ve Dünya Tarihi",
            "cikmis_islamiyet": "Çıkmış Sorular: İslamiyet Öncesi",
            "cikmis_turk_islam": "Çıkmış Sorular: İlk Türk İslam",
            "cikmis_osmanli": "Çıkmış Sorular: Osmanlı",
            "cikmis_inkilap": "Çıkmış Sorular: İnkılap",
            "cikmis_cagdas": "Çıkmış Sorular: Çağdaş",
            "karisik": "Karışık Çözüm (Tüm Sorular)"
        };

        let currentUnit = "islamiyet_oncesi";
        let currentIndex = 0;
        let isFlipped = false;
        
        flashcardsData['arama_sonuclari'] = [];
        unitNames['arama_sonuclari'] = "Arama Sonuçları";
        unitNames['yeni_nesil_zor'] = "PİKOS Özel Seçmece Zor Sorular";

        let currentQuestions = [];

        // Load favorites from local storage
        let savedFavorites = JSON.parse(localStorage.getItem('kpss_favorites')) || [];
        flashcardsData['favoriler'] = savedFavorites;

        // Ensure unitNames has favoriler
        unitNames['favoriler'] = "Favorilerim (Yıldızlananlar)";


        const flashcardEl = document.getElementById('flashcard');
        const questionEl = document.getElementById('cardQuestion');
        const answerEl = document.getElementById('cardAnswer');
        const progressCountEl = document.getElementById('progressCount');
        const progressBarEl = document.getElementById('progressBar');
        const unitNameDisplay = document.getElementById('unitNameDisplay');
        const unitSelect = document.getElementById('unitSelect');


        
        function updateCategoryCounts() {
            let total = 0;
            for (let key in flashcardsData) {
                const el = document.getElementById('count_' + key);
                if (el && flashcardsData[key]) {
                    el.textContent = flashcardsData[key].length + " Soru";
                    total += flashcardsData[key].length;
                }
            }
            const elKarisik = document.getElementById('count_karisik');
            if (elKarisik) {
                elKarisik.textContent = "Toplam " + total + " Soru";
            }
        }

        function showHome() {
            updateCategoryCounts();
            document.getElementById('flashcardMode').style.display = 'none';
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('homeMode').style.display = 'grid';
        }

        
        function handleSearch(event) {
            if (event.key === 'Enter') {
                executeSearch();
            }
        }

        function executeSearch() {
            const input = document.getElementById('searchInput');
            const term = input.value.trim().toLowerCase();
            
            if (!term) {
                alert("Lütfen aramak için bir kelime veya kavram yazın.");
                return;
            }

            // Define categories to search (exclude special ones)
            const excludedKeys = ['favoriler', 'arama_sonuclari', 'karisik'];
            let results = [];
            
            for (let key in flashcardsData) {
                if (excludedKeys.includes(key)) continue;
                
                const questions = flashcardsData[key] || [];
                for (let i = 0; i < questions.length; i++) {
                    const qText = (questions[i].q || "").toLowerCase();
                    const aText = (questions[i].a || "").toLowerCase();
                    
                    if (qText.includes(term) || aText.includes(term)) {
                        // Prevent duplicates
                        const exists = results.some(r => r.q === questions[i].q && r.a === questions[i].a);
                        if (!exists) {
                            results.push(questions[i]);
                        }
                    }
                }
            }

            if (results.length === 0) {
                alert(`"${term}" kelimesi ile eşleşen bir sonuç bulunamadı.`);
                return;
            }

            flashcardsData['arama_sonuclari'] = results;
            alert(`"${term}" kelimesi toplam ${results.length} soruda bulundu. Sonuçlara yönlendiriliyorsunuz.`);
            
            input.value = ''; // clear input
            startCategory('arama_sonuclari');
        }

        function startCategory(cat) {
            unitSelect.value = cat;
            document.getElementById('homeMode').style.display = 'none';
            document.getElementById('flashcardMode').style.display = 'flex';
            document.getElementById('backBtn').style.display = 'flex';
            changeUnit();
        }

        function init() {
            unitNameDisplay.textContent = unitNames[currentUnit];
            loadQuestions();
            loadCard();
            updateProgress();
        }

        function loadQuestions() {
            if (currentUnit === "karisik") {
                currentQuestions = [];
                for (let key in flashcardsData) {
                    currentQuestions = currentQuestions.concat(flashcardsData[key]);
                }
                // Fisher-Yates shuffle
                for (let i = currentQuestions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [currentQuestions[i], currentQuestions[j]] = [currentQuestions[j], currentQuestions[i]];
                }
            } else {
                currentQuestions = [...flashcardsData[currentUnit]];
            }
        }

        function changeUnit() {
            currentUnit = unitSelect.value;
            currentIndex = 0;
            unitNameDisplay.textContent = unitNames[currentUnit];
            loadQuestions();
            
            if(isFlipped) {
                flashcardEl.classList.remove('is-flipped');
                isFlipped = false;
                setTimeout(() => {
                    loadCard();
                    updateProgress();
                }, 300);
            } else {
                loadCard();
                updateProgress();
            }
        }

        function loadCard() {
            const card = currentQuestions[currentIndex];
            
            questionEl.style.opacity = 0;
            answerEl.style.opacity = 0;
            
            setTimeout(() => {
                questionEl.innerHTML = card.q.replace(/\n/g, '<br>');
                answerEl.innerHTML = card.a;
                questionEl.style.opacity = 1;
                answerEl.style.opacity = 1;
                updateStarUI();
            }, 150);
        }

        
        function toggleFavorite(event) {
            // Prevent card flip when clicking the star
            event.stopPropagation();
            
            const card = currentQuestions[currentIndex];
            const favIndex = flashcardsData['favoriler'].findIndex(f => f.q === card.q && f.a === card.a);
            
            if (favIndex === -1) {
                // Add to favorites
                flashcardsData['favoriler'].push(card);
            } else {
                // Remove from favorites
                flashcardsData['favoriler'].splice(favIndex, 1);
                // If we are currently studying favorites, we might want to remove it from current view too
                if (currentUnit === 'favoriler') {
                    currentQuestions.splice(currentIndex, 1);
                    if (currentQuestions.length === 0) {
                        alert("Favorilerinizde soru kalmadı. Anasayfaya yönlendiriliyorsunuz.");
                        showHome();
                        return;
                    }
                    if (currentIndex >= currentQuestions.length) currentIndex--;
                    if (isFlipped) {
                        flashcardEl.classList.remove('is-flipped');
                        isFlipped = false;
                        setTimeout(() => { loadCard(); updateProgress(); }, 300);
                        saveFavorites();
                        return;
                    } else {
                        loadCard();
                        updateProgress();
                        saveFavorites();
                        return;
                    }
                }
            }
            
            saveFavorites();
            updateStarUI();
            updateCategoryCounts();
        }

        function saveFavorites() {
            localStorage.setItem('kpss_favorites', JSON.stringify(flashcardsData['favoriler']));
        }

        function updateStarUI() {
            if (currentQuestions.length === 0) return;
            const card = currentQuestions[currentIndex];
            const isFav = flashcardsData['favoriler'].some(f => f.q === card.q && f.a === card.a);
            const stars = document.querySelectorAll('.star-btn');
            stars.forEach(btn => {
                if (isFav) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function flipCard() {
            isFlipped = !isFlipped;
            if (isFlipped) {
                flashcardEl.classList.add('is-flipped');
            } else {
                flashcardEl.classList.remove('is-flipped');
            }
        }

        function nextCard() {
            if (currentIndex < currentQuestions.length - 1) {
                if (isFlipped) {
                    flipCard();
                    setTimeout(() => {
                        currentIndex++;
                        loadCard();
                        updateProgress();
                    }, 300);
                } else {
                    currentIndex++;
                    loadCard();
                    updateProgress();
                }
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                if (isFlipped) {
                    flipCard();
                    setTimeout(() => {
                        currentIndex--;
                        loadCard();
                        updateProgress();
                    }, 300);
                } else {
                    currentIndex--;
                    loadCard();
                    updateProgress();
                }
            }
        }

        
        function markAsWrong() {
            if (currentQuestions.length > 1 && currentIndex < currentQuestions.length - 1) {
                // Remove the current card
                const currentCard = currentQuestions.splice(currentIndex, 1)[0];
                
                // Calculate new position: 8 cards later
                let newPosition = currentIndex + 8;
                if (newPosition > currentQuestions.length) {
                    newPosition = currentQuestions.length;
                }
                
                // Insert the card at the new position
                currentQuestions.splice(newPosition, 0, currentCard);
                
                if (isFlipped) {
                    flipCard();
                    setTimeout(() => {
                        loadCard();
                        updateProgress();
                    }, 300);
                } else {
                    loadCard();
                    updateProgress();
                }
            } else if (currentIndex === currentQuestions.length - 1) {
                alert("Bu destedeki son sorudasınız. Tekrar etmek için 'Karıştır' butonunu kullanabilirsiniz.");
            }
        }

        function markAsLearned() {
            if (currentQuestions.length > 1 && currentIndex < currentQuestions.length - 1) {
                const currentCard = currentQuestions.splice(currentIndex, 1)[0];
                currentQuestions.push(currentCard);
                
                if (isFlipped) {
                    flipCard();
                    setTimeout(() => {
                        loadCard();
                        updateProgress();
                    }, 300);
                } else {
                    loadCard();
                    updateProgress();
                }
            }
        }

        function shuffleCurrentQuestions() {
            for (let i = currentQuestions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentQuestions[i], currentQuestions[j]] = [currentQuestions[j], currentQuestions[i]];
            }
            currentIndex = 0;
            if(isFlipped) {
                flashcardEl.classList.remove('is-flipped');
                isFlipped = false;
                setTimeout(() => {
                    loadCard();
                    updateProgress();
                }, 300);
            } else {
                loadCard();
                updateProgress();
            }
        }

        function updateProgress() {
            const total = currentQuestions.length;
            const current = currentIndex + 1;
            progressCountEl.textContent = `${current} / ${total}`;
            const percentage = (current / total) * 100;
            progressBarEl.style.width = `${percentage}%`;
        }

        // Initialize on load
        window.onload = showHome;
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowRight' || e.key === 'Space') {
                if(e.key === 'Space') e.preventDefault();
                nextCard();
            } else if(e.key === 'ArrowLeft') {
                prevCard();
            } else if(e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                e.preventDefault();
                flipCard();
            }
        });
    
        // Pomodoro Logic
        const WORK_TIME = 30 * 60; // 30 minutes
        const BREAK_TIME = 6 * 60; // 6 minutes
        
        let pomoTimeLeft = WORK_TIME;
        let isWorkMode = true;
        let isRunning = false;
        let pomoInterval = null;

        function updatePomoDisplay() {
            const minutes = Math.floor(pomoTimeLeft / 60);
            const seconds = pomoTimeLeft % 60;
            document.getElementById('pomoTime').textContent = 
                String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
        }

        function togglePomodoro() {
            if (isRunning) {
                clearInterval(pomoInterval);
                isRunning = false;
                document.getElementById('pomoPlayIcon').style.display = 'block';
                document.getElementById('pomoPauseIcon').style.display = 'none';
            } else {
                isRunning = true;
                document.getElementById('pomoPlayIcon').style.display = 'none';
                document.getElementById('pomoPauseIcon').style.display = 'block';
                pomoInterval = setInterval(() => {
                    pomoTimeLeft--;
                    updatePomoDisplay();
                    
                    if (pomoTimeLeft <= 0) {
                        clearInterval(pomoInterval);
                        isRunning = false;
                        document.getElementById('pomoPlayIcon').style.display = 'block';
                        document.getElementById('pomoPauseIcon').style.display = 'none';
                        
                        if (isWorkMode) {
                            alert("Süre bitti! Harika bir odaklanmayla 30 dakikayı tamamladınız. Şimdi 6 dakikalık mola zamanı.");
                            isWorkMode = false;
                            pomoTimeLeft = BREAK_TIME;
                            document.getElementById('pomoLabel').textContent = "MOLA (6 DK)";
                            document.getElementById('pomodoro').classList.add('break-mode');
                        } else {
                            alert("Mola bitti! Haydi odaklanıp tekrar çalışmaya başlayalım.");
                            isWorkMode = true;
                            pomoTimeLeft = WORK_TIME;
                            document.getElementById('pomoLabel').textContent = "ÇALIŞMA (30 DK)";
                            document.getElementById('pomodoro').classList.remove('break-mode');
                        }
                        updatePomoDisplay();
                    }
                }, 1000);
            }
        }

        function resetPomodoro() {
            clearInterval(pomoInterval);
            isRunning = false;
            isWorkMode = true;
            pomoTimeLeft = WORK_TIME;
            document.getElementById('pomoPlayIcon').style.display = 'block';
            document.getElementById('pomoPauseIcon').style.display = 'none';
            document.getElementById('pomoLabel').textContent = "ÇALIŞMA (30 DK)";
            document.getElementById('pomodoro').classList.remove('break-mode');
            updatePomoDisplay();
        }

        // Progress Bar Drag & Seek functionality
        const progressBgEl = document.querySelector('.progress-bar-bg');
        let isDraggingProgress = false;

        function seekProgress(e) {
            if(!currentQuestions || currentQuestions.length === 0) return;
            const rect = progressBgEl.getBoundingClientRect();
            const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
            let x = clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));
            const percentage = x / rect.width;
            
            // Map percentage to an index (0 to length - 1)
            let targetIndex = Math.floor(percentage * currentQuestions.length);
            
            // Edge case: exactly 100% gives an out of bounds index
            if(targetIndex === currentQuestions.length) {
                targetIndex = currentQuestions.length - 1;
            }

            if(targetIndex !== currentIndex && targetIndex >= 0 && targetIndex < currentQuestions.length) {
                currentIndex = targetIndex;
                
                // Flip back if currently flipped
                const flashcardEl = document.getElementById('flashcard');
                if (isFlipped) {
                    flashcardEl.classList.remove('is-flipped');
                    isFlipped = false;
                    setTimeout(() => {
                        loadCard();
                        updateProgress();
                    }, 300);
                } else {
                    loadCard();
                    updateProgress();
                }
            }
        }

        progressBgEl.addEventListener('mousedown', (e) => {
            isDraggingProgress = true;
            seekProgress(e);
        });

        window.addEventListener('mousemove', (e) => {
            if(isDraggingProgress) seekProgress(e);
        });

        window.addEventListener('mouseup', () => {
            isDraggingProgress = false;
        });

        progressBgEl.addEventListener('touchstart', (e) => {
            isDraggingProgress = true;
            seekProgress(e);
        }, {passive: true});

        window.addEventListener('touchmove', (e) => {
            if(isDraggingProgress) seekProgress(e);
        }, {passive: true});

        window.addEventListener('touchend', () => {
            isDraggingProgress = false;
        });

    </script>

    <!-- Pomodoro Widget -->
    <div id="pomodoro" class="pomodoro-container">
        <div id="pomoLabel" class="pomo-label">ÇALIŞMA (30 DK)</div>
        <div id="pomoTime" class="pomo-time">30:00</div>
        <div class="pomo-controls">
            <button class="pomo-btn" onclick="togglePomodoro()" id="pomoToggleBtn" title="Başlat/Duraklat">
                <svg id="pomoPlayIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                <svg id="pomoPauseIcon" style="display:none;" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
            </button>
            <button class="pomo-btn" onclick="resetPomodoro()" title="Sıfırla">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
            </button>
        </div>
    </div>

</body>
</html>
