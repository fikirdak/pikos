<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PİKOS SORU BANKASI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --success: #10b981;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 2rem 1rem;
        }

        /* Glassmorphism Background Elements */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.4;
        }
        .blob-1 {
            top: -10%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: var(--primary);
        }
        .blob-2 {
            bottom: -10%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: var(--accent);
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            z-index: 10;
            animation: fadeIn 1s ease-out;
            flex-wrap: wrap;
            justify-content: center;
        }

        select {
            appearance: none;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.75rem 3rem 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            outline: none;
            font-family: 'Inter', sans-serif;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem top 50%;
            background-size: 0.65rem auto;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        select:hover {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }
        
        select option {
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* Flashcard Container */
        .flashcard-container {
            width: 100%;
            max-width: 600px;
            height: 350px;
            perspective: 1000px;
            margin-bottom: 2rem;
            z-index: 10;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2.5rem;
            text-align: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow);
        }

        .card-front {
            /* Front specific styles */
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border-top: 2px solid var(--primary);
        }

        .card-label {
            position: absolute;
            top: 1.5rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .card-content {
            font-size: 1.4rem;
            line-height: 1.5;
            font-weight: 500;
        }
        
        .card-back .card-content {
            color: #e2e8f0;
            font-size: 1.25rem;
        }

        .card-back .card-content hr {
            border: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 1.2rem 0;
        }

        .card-back .card-content small {
            display: block;
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.5;
            text-align: left;
        }

        .card-back .card-content small strong {
            color: #cbd5e1;
        }

        .card-hint {
            position: absolute;
            bottom: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: pulse 2s infinite;
        }

        .card-hint svg {
            width: 16px;
            height: 16px;
        }

        .navigation {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            z-index: 10;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-hover), var(--accent-hover));
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }

        .progress-container {
            width: 100%;
            max-width: 600px;
            margin-top: 2rem;
            z-index: 10;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 10px;
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        @media (max-width: 640px) {
            h1 { font-size: 2rem; }
            .flashcard-container { height: 400px; }
            .card-content { font-size: 1.2rem; }
            .controls { flex-direction: column; width: 100%; max-width: 300px; }
            select { width: 100%; }
        }
    
        /* Home Grid */
        .home-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1000px;
            margin-top: 1rem;
            animation: fadeIn 0.8s ease-out;
        }

        .category-btn {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            color: white;
            font-size: 1.25rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .category-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: inherit;
            filter: brightness(1.3);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: -1;
        }

        .category-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .category-btn:hover::before {
            opacity: 0.2;
        }

        .cat-subtitle {
            font-size: 0.9rem;
            font-weight: 400;
            opacity: 0.8;
            font-family: 'Inter', sans-serif;
        }

        .back-btn {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            z-index: 100;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-3px);
        }

        #flashcardMode {
            width: 100%;
            display: none; /* hidden by default */
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s ease-out;
        }

        @media (max-width: 768px) {
            .back-btn {
                position: relative;
                top: 0;
                left: 0;
                margin-bottom: 1.5rem;
                align-self: flex-start;
            }
        }

    </style>
</head>
<body>

    <!-- Ambient Background -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <header>
        <h1>PİKOS SORU BANKASI</h1>
        <p class="subtitle">KPSS Hazırlık Bilgi Kartları</p>
    </header>

    
    <button id="backBtn" class="back-btn" style="display: none;" onclick="showHome()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Anasayfaya Dön
    </button>

    <div id="homeMode" class="home-grid">
        <button class="category-btn" style="border-left: 6px solid #3b82f6;" onclick="startCategory('islamiyet_oncesi')">
            İslamiyet Öncesi
            <span class="cat-subtitle" id="count_islamiyet_oncesi">Tarih Bilgi Kartları</span>
        </button>
        <button class="category-btn" style="border-left: 6px solid #10b981;" onclick="startCategory('ilk_turk_islam')">
            İlk Türk İslam
            <span class="cat-subtitle" id="count_ilk_turk_islam">Tarih Bilgi Kartları</span>
        </button>
        <button class="category-btn" style="border-left: 6px solid #8b5cf6;" onclick="startCategory('osmanli')">
            Osmanlı Devleti
            <span class="cat-subtitle" id="count_osmanli">Tarih Bilgi Kartları</span>
        </button>
        <button class="category-btn" style="border-left: 6px solid #ef4444;" onclick="startCategory('inkilap')">
            İnkılap Tarihi
            <span class="cat-subtitle" id="count_inkilap">Tarih Bilgi Kartları</span>
        </button>
        <button class="category-btn" style="border-left: 6px solid #f59e0b;" onclick="startCategory('cagdas')">
            Çağdaş Türk ve Dünya
            <span class="cat-subtitle" id="count_cagdas">Tarih Bilgi Kartları</span>
        </button>
        <button class="category-btn" style="border-left: 6px solid #ec4899;" onclick="startCategory('karisik')">
            Karışık Çözüm
            <span class="cat-subtitle" id="count_karisik">Tüm Kategoriler</span>
        </button>
        
        <div style="grid-column: 1 / -1; margin-top: 1rem;">
            <h3 style="color: var(--text-muted); font-weight: 500; font-size: 1.1rem; border-bottom: 1px solid var(--card-border); padding-bottom: 0.5rem; margin-bottom: 0.5rem;">Çıkmış Sorular (ÖSYM Arşivi)</h3>
        </div>
        
        <button class="category-btn" style="background: linear-gradient(145deg, rgba(59, 130, 246, 0.2), rgba(30, 41, 59, 0.7)); border-left: 6px solid #3b82f6;" onclick="startCategory('cikmis_islamiyet')">
            Çıkmış: İslamiyet Öncesi
            <span class="cat-subtitle" id="count_cikmis_islamiyet">Geçmiş Yıllar Soru Havuzu</span>
        </button>
        <button class="category-btn" style="background: linear-gradient(145deg, rgba(16, 185, 129, 0.2), rgba(30, 41, 59, 0.7)); border-left: 6px solid #10b981;" onclick="startCategory('cikmis_turk_islam')">
            Çıkmış: İlk Türk İslam
            <span class="cat-subtitle" id="count_cikmis_turk_islam">Geçmiş Yıllar Soru Havuzu</span>
        </button>
        <button class="category-btn" style="background: linear-gradient(145deg, rgba(139, 92, 246, 0.2), rgba(30, 41, 59, 0.7)); border-left: 6px solid #8b5cf6;" onclick="startCategory('cikmis_osmanli')">
            Çıkmış: Osmanlı
            <span class="cat-subtitle" id="count_cikmis_osmanli">Geçmiş Yıllar Soru Havuzu</span>
        </button>
        <button class="category-btn" style="background: linear-gradient(145deg, rgba(239, 68, 68, 0.2), rgba(30, 41, 59, 0.7)); border-left: 6px solid #ef4444;" onclick="startCategory('cikmis_inkilap')">
            Çıkmış: İnkılap
            <span class="cat-subtitle" id="count_cikmis_inkilap">Geçmiş Yıllar Soru Havuzu</span>
        </button>
        <button class="category-btn" style="background: linear-gradient(145deg, rgba(245, 158, 11, 0.2), rgba(30, 41, 59, 0.7)); border-left: 6px solid #f59e0b;" onclick="startCategory('cikmis_cagdas')">
            Çıkmış: Çağdaş
            <span class="cat-subtitle" id="count_cikmis_cagdas">Geçmiş Yıllar Soru Havuzu</span>
        </button>
    </div>

    <div id="flashcardMode">
        <div class="controls">
        <select id="unitSelect" onchange="changeUnit()">
            <optgroup label="Konu Anlatımı (Pusula Notları)">
                <option value="islamiyet_oncesi">İslamiyet Öncesi Türk Tarihi</option>
                <option value="ilk_turk_islam">İlk Türk İslam Devletleri</option>
                <option value="osmanli">Osmanlı Devleti</option>
                <option value="inkilap">İnkılap Tarihi</option>
                <option value="cagdas">Çağdaş Türk ve Dünya Tarihi</option>
            </optgroup>
            <optgroup label="Çıkmış Sorular (2014-2023)">
                <option value="cikmis_islamiyet">Çıkmış Sorular: İslamiyet Öncesi</option>
                <option value="cikmis_turk_islam">Çıkmış Sorular: İlk Türk İslam</option>
                <option value="cikmis_osmanli">Çıkmış Sorular: Osmanlı</option>
                <option value="cikmis_inkilap">Çıkmış Sorular: İnkılap</option>
                <option value="cikmis_cagdas">Çıkmış Sorular: Çağdaş</option>
            </optgroup>
            <optgroup label="Yeni Eklenenler">
                
            </optgroup>
            <optgroup label="Genel Deneme">
                <option value="karisik">Karışık Çözüm (Tüm Sorular)</option>
            </optgroup>
        </select>
    </div>

    <div class="flashcard-container" onclick="flipCard()">
        <div class="flashcard" id="flashcard">
            <!-- Front -->
            <div class="card-face card-front">
                <div class="card-label">Soru</div>
                <div class="card-content" id="cardQuestion">Yükleniyor...</div>
                <div class="card-hint">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-9.21l-5.44-5.44"/>
                    </svg>
                    Çevirmek için tıkla
                </div>
            </div>
            <!-- Back -->
            <div class="card-face card-back">
                <div class="card-label" style="color: var(--primary);">Cevap</div>
                <div class="card-content" id="cardAnswer">Yükleniyor...</div>
            </div>
        </div>
    </div>

    <div class="navigation">
        <button class="btn" style="background-color: #8b5cf6; color: white; border: none; padding: 0.75rem 1rem;" onclick="shuffleCurrentQuestions()" title="Soruları Karıştır">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
        </button>
        <button class="btn" onclick="prevCard()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
            Önceki
        </button>
        <button class="btn" style="background-color: #10b981; color: white; border: none; padding: 0.75rem 1rem;" onclick="markAsLearned()" title="Soruyu en sona gönder">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
            Öğrendim
        </button>
        <button class="btn btn-primary" onclick="nextCard()">
            Sonraki
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
    </div>

    <div class="progress-container">
        <div class="progress-text">
            <span id="unitNameDisplay">İslamiyet Öncesi Türk Tarihi</span>
            <span id="progressCount">1 / 10</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>
    </div>

    <script>
        // Data Extracted from 1.pdf, 2.pdf, 3.pdf, 4.pdf
        const flashcardsData = {
    "islamiyet_oncesi": [
        {
            "q": "Göktürklerin (I. Göktürk) siyasi ve sosyal tarihini anlatan, ancak dili Sogdça (ve Brahmi) olan, Türk tarihinin bilinen ilk yazıtı kabul edilen eser hangisidir?",
            "a": "Bugut Yazıtı<hr><small><strong>Açıklama:</strong> I. Göktürk devleti zamanında (Taspar/Tapo Kağan dönemine ait) dikilmiştir. Sogdça yazılmış olması Türklerin diplomatik ve ticari dilde Sogdları kullandığını gösterir.</small>"
        },
        {
            "q": "Orta Asya Türk devletlerinde, kağanın başkanlığında toplanan Kurultay'da (Toy) her boy beyinin oturacağı yere (mevki ve makama) ne ad verilirdi?",
            "a": "Orun<hr><small><strong>Açıklama:</strong> Kurultayda yenilecek yemekten (Ülüş/Ülüğ) alınan pay ile oturulacak yer (Orun), boyların devlet içindeki hiyerarşisini ve gücünü temsil ederdi.</small>"
        },
        {
            "q": "Uygur Devleti'nde kağıt paraya 'Çav' adı verilirken, mühürlenmiş ticari bez parçalarına (kumaş para) ne ad verilirdi?",
            "a": "Kamdu (veya Kupon)<hr><small><strong>Açıklama:</strong> Türklerde ilk para Türgişler döneminde (Baga Tarkan) madeni olarak basılsa da, kağıt para (Çav) ve bez/kumaş para (Kamdu / Böz) Uygurların gelişmiş ticaretinin kanıtıdır.</small>"
        },
        {
            "q": "Peçenekler ve Uzlar (Oğuzlar), aşağıdaki Bizans savaşlarından hangisinde taraf değiştirerek Selçuklu saflarına geçmiş ve savaşın kaderini belirlemişlerdir?",
            "a": "Malazgirt Savaşı (1071)<hr><small><strong>Açıklama:</strong> Bizans ordusunda ücretli askerlik yapan Peçenek ve Uz (Oğuz) Türkleri, karşılarındaki ordunun soydaşları olduğunu anlayınca Alparslan'ın tarafına geçmiştir.</small>"
        },

        {
            "q": "[Fetihname'den] Osmanlı tımar sisteminde, vergi gelirlerinin en yüksek olduğu (yıllık 100.000 akçeden fazla) ve padişah, vezir, beylerbeyi gibi en üst düzey komutanlara ayrılan dirlik toprağı hangisidir?",
            "a": "Has Arazi<hr><small><strong>Açıklama:</strong> Has (en yüksek), Zeamet (orta düzey 20-100 bin arası), Tımar (en alt düzey memur/askerlere, 20 binden az) şeklinde üçe ayrılır.</small>"

            "q": "[Fetihname'den] Divan-ı Hümayun'da örfi hukukun uygulayıcısı, fethedilen toprakların Tahrir (kayıt) defterlerini tutan ve Tımar (dirlik) dağıtımını yapan Kalemiye sınıfı başkanı kimdir?",
            "a": "Nişancı<hr><small><strong>Açıklama:</strong> Padişahın tuğrasını da (fermanlara) çekerdi. XVII. yüzyıldan sonra dış işlerinin (diplomasinin) artmasıyla Nişancı'nın emrindeki Reis-ül Küttab dışişleri bakanı seviyesine yükselmiştir.</small>"

        {

            "a": "Milli Egemenliği ve Bağımsızlık Kararlılığını<hr><small><strong>Açıklama:</strong> Aynı zamanda Osmanlı Hükümeti'ni (İstanbul'u) yok saymıştır.</small>"

        {

            "a": "Güçler Birliği (Yasama ve Yürütmenin tek elde toplanması)<hr><small><strong>Açıklama:</strong> Kurtuluş Savaşı sürdüğü için kararların hızlı alınıp uygulanması amacıyla kuvvetler ayrılığı değil BİRLİĞİ benimsenmiştir.</small>"

        {
            "q": "[Fetihname'den] I. TBMM'ye karşı çıkarılan ayaklanmaları (iç isyanları) bastırmak ve asker kaçaklarını önlemek için TBMM'nin çıkardığı kanunun adı nedir?",

        {

            "a": "Sevr Barış Antlaşması<hr><small><strong>Açıklama:</strong> TBMM, Sevr'i imzalayanları vatan haini ilan etmiş ve Anadolu'daki işgalleri meşrulaştıran bu belgeyi asla tanımamıştır.</small>"

        {
            "q": "[Fetihname'den] Sevr Antlaşması'nı imzalayan Saltanat Şurası'nda (Meclisi Ali) tek başına ret oyu vererek antlaşmayı onaylamayan onurlu paşa kimdir?",

        {

        {
            "q": "[Fetihname'den] TBMM'nin uluslararası alanda İLK ASKERİ ve SİYASİ BAŞARISI olan, Ermenistan'ın Misak-ı Milli'yi (ve Sevr'in geçersizliğini) kabul ettiği antlaşma hangisidir?",

        {
            "q": "[Fetihname'den] Kurtuluş Savaşı'nda GÜNEY CEPHESİ'nde düzenli ordu SAVAŞMAMIŞTIR. Peki Fransızlara ve Ermeni intikam tugaylarına karşı kim savaşmıştır?",
            "a": "Kuva-yi Milliye (Bölgesel Milis Güçleri)<hr><small><strong>Açıklama:</strong> Sütçü İmam (Maraş), Şahin Bey (Antep), Ali Saip Bey (Urfa) gibi halk kahramanları bölgeyi savunmuştur.</small>"

        {
            "q": "[Fetihname'den] Güney Cephesi'ni KESİN olarak kapatan ve Fransızların TBMM'yi tanıyarak Hatay hariç Güney'den çekilmesini sağlayan antlaşma hangisidir?",

        {

        {

            "a": "I. İnönü Muharebesi (6-11 Ocak 1921)<hr><small><strong>Açıklama:</strong> Bu savaş sırasında aynı zamanda Çerkez Ethem isyanı da bastırılmıştır.</small>"

        {
            "q": "[Fetihname'den] I. İnönü Savaşı'nın İÇ sonuçları nelerdir? (Şifre: MİLAT / TALİM)",

        {
            "q": "[Fetihname'den] Yeni Türk Devleti'nin (TBMM'nin) İLK ANAYASASI olan ve 20 Ocak 1921'de kabul edilen anayasanın adı nedir?",

        {
            "q": "[Fetihname'den] 12 Mart 1921'de kabul edilen İstiklal Marşı, Mehmet Akif Ersoy tarafından kime ithaf edilmiştir?",

        },
        {
            "q": "[Fetihname'den] İstiklal Marşı'nın İLK BESTECİSİ ve 1930'dan sonra kabul edilen GÜNÜMÜZDEKİ BESTECİSİ kimlerdir?",
            "a": "İlk besteci: Ali Rıfat Çağatay / Günümüz bestecisi: Osman Zeki Üngör<hr><small><strong>Açıklama:</strong> Marşın TBMM'de ilk okuyan mebus ise Maarif (Milli Eğitim) Vekili Hamdullah Suphi Tanrıöver'dir.</small>"

        {
            "q": "[Fetihname'den] I. İnönü Zaferi sonrası İtilaf Devletleri'nin 'Sevr'i yumuşatarak kabul ettirmek' amacıyla topladığı ve TBMM'nin (Bekir Sami Bey ile) İLK KEZ HUKUKEN tanındığı konferans hangisidir?",
            "a": "Londra Konferansı<hr><small><strong>Açıklama:</strong> Osmanlı hükümeti adına Tevfik Paşa katılmış ve 'Ben sözü milletin asıl temsilcisine, TBMM delege heyetine bırakıyorum' diyerek İtilaf Devletlerinin ikili çıkarma oyununu bozmuştur.</small>"

        {

        {
            "q": "[Fetihname'den] TBMM'yi (Misak-ı Milli'yi) tanıyan ve Sevr'i reddeden İLK BÜYÜK AVRUPA (Batı) devleti hangisidir?",
            "a": "Sovyet Rusya (SSCB)<hr><small><strong>Açıklama:</strong> 16 Mart 1921 Moskova Antlaşması ile Çarlık Rusya ile Osmanlı'nın eski antlaşmaları iptal sayılmıştır.</small>"

        {

        {
            "q": "[Fetihname'den] Mustafa Kemal'in İsmet Paşa'ya çektiği 'Siz orada yalnız düşmanı değil, milletin makus (kötü giden) talihini de yendiniz' telgrafı hangi savaştan sonradır?",
            "a": "II. İnönü Muharebesi<hr><small><strong>Açıklama:</strong> Bu zaferle İtalyanlar Anadolu'dan çekilmeye (Muğla/Antalya) başlamış, Fransızlar barış teklif etmiştir.</small>"

        {

        {

        {
            "q": "[Fetihname'den] Eskişehir-Kütahya yenilgisinden sonra TBMM'nin tüm yetkilerini (Yasama, Yürütme, Yargı) 3 aylığına Mustafa Kemal'e devrettiği kanunun adı nedir?",
            "a": "Başkomutanlık Kanunu<hr><small><strong>Açıklama:</strong> M. Kemal askerlik mesleğine (Erzurum Kongresi öncesi istifa etmişti) resmen ve yetkiyle Geri Dönmüştür.</small>"

        {
            "q": "[Fetihname'den] Mustafa Kemal'in Başkomutan sıfatıyla ordunun ihtiyaçlarını (silah, yiyecek, giyecek, binek hayvanı) HALKTAN (Borç olarak veya hibe) karşılamak için çıkardığı emirlerin adı nedir?",
            "a": "Tekalif-i Milliye Emirleri (Milli Yükümlülükler)<hr><small><strong>Açıklama:</strong> Bu emirleri uygulamak için İstiklal Mahkemeleri tekrar görevlendirilmiştir. Topyekün savaşın en iyi örneğidir.</small>"

        {
            "q": "[Fetihname'den] 'Hatt-ı müdafaa yoktur, sath-ı müdafaa vardır. O satıh bütün vatandır.' sözünün Mustafa Kemal tarafından söylendiği, tarihimizde 'Subaylar Savaşı' olarak bilinen muharebe hangisidir?",

        {

        {
            "q": "[Fetihname'den] Sakarya Zaferi sonrasında Kafkas Cumhuriyetleri (Azerbaycan, Gürcistan, Ermenistan) ile imzalanan ve DOĞU SINIRINI KESİN OLARAK BELİRLEYEN antlaşma hangisidir?",

        {

        {
            "q": "[Fetihname'den] 26 Ağustos 1922'de Afyon'da başlayıp (Dumlupınar Meydan Muharebesi / Başkomutanlık) Yunanlıların denize dökülmesiyle biten kesin taarruzun adı nedir?",

        {
            "q": "[Fetihname'den] Büyük Taarruz sonrası (Ekim 1922) Kurtuluş Savaşı'nın ASKERİ SAFHASINI bitiren ve DİPLOMASİ SAFHASINI başlatan ateşkes antlaşması hangisidir?",

        {

        },
        {
            "q": "[Fetihname'den] Lozan Barış Konferansı'na TBMM adına Başdelege (Dışişleri Bakanı olarak) kim katılmıştır?",

            "a": "1- Kapitülasyonların kesinlikle kaldırılması, 2- Ermeni yurdu (Doğu'da devlet) iddialarının reddedilmesi<hr><small><strong>Açıklama:</strong> Türk heyeti bu iki konuda dik durmuş, gerekirse masadan kalkılmasını sağlamıştır.</small>"

        {

        {

        {
            "q": "[Fetihname'den] Lozan'da Yabancı Okullar sorunu, Türkiye tarafından hangi ilke (gerekçe) öne sürülerek İÇ SORUN sayılmış ve taviz verilmemiştir?",

        {
            "q": "[Fetihname'den] İtilaf Devletlerinin Lozan'a 'Osmanlı Hükümetini' de (ikilik çıkarmak için) çağırması üzerine, TBMM'nin aldığı KESİN KARAR nedir?",

        {
            "q": "[Fetihname'den] Atatürk ilkelerinin temelini oluşturan, saltanatın kaldırılarak Cumhuriyet'in ilan edilmesine (seçimlere) dayanan ana ilke hangisidir?",

        {
            "q": "[Fetihname'den] Sınıf zümre ayrımını reddeden, kanun önünde eşitliği savunan ve sosyal devlet (halka hizmet) anlayışını benimseyen Atatürk ilkesi hangisidir?",
            "a": "Halkçılık<hr><small><strong>Açıklama:</strong> Aşar vergisinin kaldırılması (köylünün rahatlatılması) ve Soyadı Kanunu (ağalık/paşalık unvanlarının iptali) en bariz örnekleridir.</small>"

        {
            "q": "[Fetihname'den] Türk tarihini ve dilini araştırmak (TTK ve TDK'nın kurulması), bağımsızlığı korumak ve milli bilinci artırmak hangi ilkenin sonucudur?",

        {
            "q": "[Fetihname'den] Akılcılık ve bilimselliği temel alan, din ve devlet işlerinin ayrılmasını, kurumların modernleşmesini sağlayan ilke hangisidir?",
            "a": "Laiklik<hr><small><strong>Açıklama:</strong> Halifeliğin kaldırılması, Tekke ve Zaviyelerin kapatılması, Medeni Kanun laiklik doğrultusundadır.</small>"
        },
        {
            "q": "[Fetihname'den] Özel sektörün gücünün yetmediği büyük yatırımların (fabrika, demiryolu) DEVLET eliyle yapılmasını öngören ekonomi ilkesi hangisidir?",
            "a": "Devletçilik<hr><small><strong>Açıklama:</strong> 1929 Dünya Ekonomik Buhranı'ndan sonra zorunlu olarak uygulanan faydacı (pragmatik) bir ilkedir.</small>"
        },
        {
            "q": "[Fetihname'den] 29 Ekim 1923'te Cumhuriyet'in ilan edilmesiyle Yeni Türk Devleti'nin 'Devlet Başkanlığı' ve 'Rejim' sorunu çözülmüş, İLK CUMHURBAŞKANI kim seçilmiştir?",
            "a": "Mustafa Kemal Atatürk<hr><small><strong>Açıklama:</strong> İlk Başbakan İsmet İnönü, ilk Meclis Başkanı (Fethi Okyar) Ali Fethi Bey olmuştur.</small>"
        },
        {
            "q": "[Fetihname'den] Cumhuriyetin ilanıyla birlikte Hükümet Kurma sisteminde 'Meclis Hükümeti' sisteminden hangi sisteme geçilmiştir?",
            "a": "Kabine Sistemine<hr><small><strong>Açıklama:</strong> Bakanların meclis içinden tek tek seçildiği eski sistem yerine, Başbakanın bakanları (kabineyi) seçtiği demokratik sisteme geçildi.</small>"
        },
        {
            "q": "[Fetihname'den] 3 Mart 1924 tarihinde Şeriye ve Evkaf Vekaleti (Din ve Vakıf Bakanlığı) kaldırılarak yerine hangi kurumlar kurulmuştur?",
            "a": "Diyanet İşleri Başkanlığı ve Vakıflar Genel Müdürlüğü<hr><small><strong>Açıklama:</strong> İlk Diyanet İşleri Başkanı Mehmet Rıfat Börekçi olmuştur. Bu adım doğrudan Laiklik adımıdır.</small>"

            "islamiyet_oncesi": "İslamiyet Öncesi Türk Tarihi",

            "cagdas": "Çağdaş Türk ve Dünya Tarihi",
            "cikmis_islamiyet": "Çıkmış Sorular: İslamiyet Öncesi",
            "cikmis_turk_islam": "Çıkmış Sorular: İlk Türk İslam",
            "cikmis_osmanli": "Çıkmış Sorular: Osmanlı",
            "cikmis_inkilap": "Çıkmış Sorular: İnkılap",
            "cikmis_cagdas": "Çıkmış Sorular: Çağdaş",
            "karisik": "Karışık Çözüm (Tüm Sorular)"
        };

        let currentUnit = "islamiyet_oncesi";
        let currentIndex = 0;
        let isFlipped = false;
        let currentQuestions = [];

        const flashcardEl = document.getElementById('flashcard');
        const questionEl = document.getElementById('cardQuestion');
        const answerEl = document.getElementById('cardAnswer');
        const progressCountEl = document.getElementById('progressCount');
        const progressBarEl = document.getElementById('progressBar');
        const unitNameDisplay = document.getElementById('unitNameDisplay');
        const unitSelect = document.getElementById('unitSelect');


        
        function updateCategoryCounts() {
            let total = 0;
            for (let key in flashcardsData) {
                const el = document.getElementById('count_' + key);
                if (el && flashcardsData[key]) {
                    el.textContent = flashcardsData[key].length + " Soru";
                    total += flashcardsData[key].length;
                }
            }
            const elKarisik = document.getElementById('count_karisik');
            if (elKarisik) {
                elKarisik.textContent = "Toplam " + total + " Soru";
            }
        }

        function showHome() {
            updateCategoryCounts();
            document.getElementById('flashcardMode').style.display = 'none';
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('homeMode').style.display = 'grid';
        }

        function startCategory(cat) {
            unitSelect.value = cat;
            document.getElementById('homeMode').style.display = 'none';
            document.getElementById('flashcardMode').style.display = 'flex';
            document.getElementById('backBtn').style.display = 'flex';
            changeUnit();
        }

        function init() {
            unitNameDisplay.textContent = unitNames[currentUnit];
            loadQuestions();
            loadCard();
            updateProgress();
        }

        function loadQuestions() {
            if (currentUnit === "karisik") {
                currentQuestions = [];
                for (let key in flashcardsData) {
                    currentQuestions = currentQuestions.concat(flashcardsData[key]);
                }
                // Fisher-Yates shuffle
                for (let i = currentQuestions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [currentQuestions[i], currentQuestions[j]] = [currentQuestions[j], currentQuestions[i]];
                }
            } else {
                currentQuestions = [...flashcardsData[currentUnit]];
            }
        }

        function changeUnit() {
            currentUnit = unitSelect.value;
            currentIndex = 0;
            unitNameDisplay.textContent = unitNames[currentUnit];
            loadQuestions();
            
            if(isFlipped) {
                flashcardEl.classList.remove('is-flipped');
                isFlipped = false;
                setTimeout(() => {
                    loadCard();
                    updateProgress();
                }, 300);
            } else {
                loadCard();
                updateProgress();
            }
        }

        function loadCard() {
            const card = currentQuestions[currentIndex];
            
            questionEl.style.opacity = 0;
            answerEl.style.opacity = 0;
            
            setTimeout(() => {
                questionEl.innerHTML = card.q.replace(/\n/g, '<br>');
                answerEl.innerHTML = card.a;
                questionEl.style.opacity = 1;
                answerEl.style.opacity = 1;
            }, 150);
        }

        function flipCard() {
            isFlipped = !isFlipped;
            if (isFlipped) {
                flashcardEl.classList.add('is-flipped');
            } else {
                flashcardEl.classList.remove('is-flipped');
            }
        }

        function nextCard() {
            if (currentIndex < currentQuestions.length - 1) {
                if (isFlipped) {
                    flipCard();
                    setTimeout(() => {
                        currentIndex++;
                        loadCard();
                        updateProgress();
                    }, 300);
                } else {
                    currentIndex++;
                    loadCard();
                    updateProgress();
                }
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                if (isFlipped) {
                    flipCard();
                    setTimeout(() => {
                        currentIndex--;
                        loadCard();
                        updateProgress();
                    }, 300);
                } else {
                    currentIndex--;
                    loadCard();
                    updateProgress();
                }
            }
        }

        function markAsLearned() {
            if (currentQuestions.length > 1 && currentIndex < currentQuestions.length - 1) {
                const currentCard = currentQuestions.splice(currentIndex, 1)[0];
                currentQuestions.push(currentCard);
                
                if (isFlipped) {
                    flipCard();
                    setTimeout(() => {
                        loadCard();
                        updateProgress();
                    }, 300);
                } else {
                    loadCard();
                    updateProgress();
                }
            }
        }

        function shuffleCurrentQuestions() {
            for (let i = currentQuestions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentQuestions[i], currentQuestions[j]] = [currentQuestions[j], currentQuestions[i]];
            }
            currentIndex = 0;
            if(isFlipped) {
                flashcardEl.classList.remove('is-flipped');
                isFlipped = false;
                setTimeout(() => {
                    loadCard();
                    updateProgress();
                }, 300);
            } else {
                loadCard();
                updateProgress();
            }
        }

        function updateProgress() {
            const total = currentQuestions.length;
            const current = currentIndex + 1;
            progressCountEl.textContent = `${current} / ${total}`;
            const percentage = (current / total) * 100;
            progressBarEl.style.width = `${percentage}%`;
        }

        // Initialize on load
        window.onload = showHome;
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowRight' || e.key === 'Space') {
                if(e.key === 'Space') e.preventDefault();
                nextCard();
            } else if(e.key === 'ArrowLeft') {
                prevCard();
            } else if(e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                e.preventDefault();
                flipCard();
            }
        });
    </script>
</body>
</html>
